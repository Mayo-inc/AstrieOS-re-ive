<template id="Erfolgen-ui">
    <div class="Achievement-window-container">
    <main class="Erfolgen-placeholder" aria-label="Erfolge und Nutzungsfortschritt">
        <div class="Achievement-dashboard">
            <header class="Achievement-profile">
                <div class="Achievement-banner">
                    <img data-profile-banner src="/Res/Bild/Hintergrund/Default-Banner.png" alt="" aria-hidden="true">
                </div>
                <div class="Achievement-profile-row">
                    <img class="Achievement-avatar" data-profile-avatar src="/Res/Bild/Logo/AddText_07-03-07.27.32.png" alt="Profilbild von Gast!">
                    <div class="Achievement-profile-identity">
                        <h1 data-profile-name>Gast!</h1>
                        <p>Deine Fortschritte auf AstrieOS</p>
                    </div>
                    <section class="Achievement-summary" aria-label="Gesamtfortschritt">
                        <div class="Achievement-summary-top">
                            <span>Gesamtfortschritt</span>
                            <strong id="Erfolgen-tracken">0%</strong>
                        </div>
                        <div class="Achievement-progress-track Achievement-overall-progress" role="progressbar" aria-label="Freigeschaltete Erfolge" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                            <span data-overall-progress></span>
                        </div>
                        <p><strong id="Erfolgen-nummer">0</strong> von <span id="Erfolgen-gesamt">0</span> Erfolgen freigeschaltet</p>
                    </section>
                </div>
            </header>

            <section class="Achievement-stats" aria-label="Deine Nutzungsstatistik">
                <article class="Achievement-stat">
                    <p>Aktive Zeit</p>
                    <strong id="user-runtime">0:00:00</strong>
                </article>
                <article class="Achievement-stat">
                    <p>Längste Sitzung</p>
                    <strong id="user-session">0:00:00</strong>
                </article>
                <article class="Achievement-stat">
                    <p>Besuche</p>
                    <strong id="user-visits">0</strong>
                </article>
                <article class="Achievement-stat">
                    <p>Klicks</p>
                    <strong id="user-clicks">0</strong>
                </article>
                <article class="Achievement-stat">
                    <p>Inaktivzeit</p>
                    <strong id="user-afk">0%</strong>
                </article>
            </section>

            <section class="Achievement-collection" aria-labelledby="Achievement-list-title">
                <div class="Achievement-collection-header">
                    <div>
                        <h2 id="Achievement-list-title">Erfolgssammlung</h2>
                        <p>Fortschritt wird lokal auf diesem Gerät gespeichert.</p>
                    </div>
                    <div class="Achievement-filters" role="group" aria-label="Erfolge filtern">
                        <button type="button" data-achievement-filter="all" aria-pressed="true">Alle</button>
                        <button type="button" data-achievement-filter="unlocked" aria-pressed="false">Erreicht</button>
                        <button type="button" data-achievement-filter="locked" aria-pressed="false">Offen</button>
                    </div>
                </div>
                <div class="Achievement-grid" data-achievement-grid></div>
            </section>
        </div>
    </main>
    </div>
</template>
